<body>
  <script>
    const Multiply = (num1,num2) => {return num1 * num2};
    console.log(Multiply(2,3));
    console.log(Multiply(7,10));

    //how many numbers greater than 0
    
    const countPositive = (nums) => {
      let count = 0;
      nums.forEach((val) => {
        if(val>0){
          count+=1
        }
      });
      console.log(count);
    }
    countPositive([1,-3,5]);
    countPositive([-2,3,-5,7,10])

    //12m 
    // const addNum = (arr , num) => {
    //   const newArr = arr.map( i => i + num);
    //   console.log(newArr);
    // }

    const addNum = (arr , num) => console.log(arr.map(i => i+num));
    addNum([1,2,3] , 1);
    addNum([-2,-1,0,99] , 2);

    //12n
    const removeEgg = (foods) => console.log(foods.filter( val => val !== 'egg'));
    removeEgg(['egg','apple','egg','egg','ham']);

    //12n - remove first 2 eggs
    const removefirstTwo = (foods) => {
      let eggCount = 0 ;
      const result = foods.filter( (val) => {
        if(val === 'egg' && eggCount<2){
          eggCount++;
          return false;
        }
        return true;
      } );
      console.log(result);
    }

    removefirstTwo(['egg','apple','egg','egg','banana']);



  </script>
