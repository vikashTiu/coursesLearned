<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    /* General body styling */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      color: #333;
    }

    /* Button styling */
    button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:active {
      background-color: #003f7f;
    }

    /* Reset button styling */
    .reset-button {
      background-color: #ff4d4d;
    }

    .reset-button:hover {
      background-color: #cc0000;
    }

    /* Display result styling */
    .display-result {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
      margin: 20px 0;
    }

    /* Display choice styling */
    .display-choice {
      font-size: 18px;
      color: #555;
      margin: 10px 0;
      font: bolder;
      font-family: 'Times New Roman', Times, serif;
      font-weight: 100;
      font-style: italic;
      font-size: large;
      
    }

    /* Display score styling */
    .display-score {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin: 20px 0;
    }

    /* Container for buttons */
    .button-container {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <h2>Play the Game!</h2>

  <div class="button-container">
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissor')">Scissor</button>
  </div>

  <p class="display-result"></p>
  <p class="display-choice"></p>
  <p class="display-score"></p>

  <button class="reset-button" onclick="
    score.win = 0;
    score.lose = 0;
    score.tie = 0;
    localStorage.removeItem('score');
    document.querySelector('.display-score').innerHTML = `Score : You win: ${score.win}, You lose: ${score.lose}, Tie: ${score.tie}`;
    document.querySelector('.display-result').innerHTML = '<br><br><br><br>';
    document.querySelector('.display-choice').innerHTML = '';

  ">Reset</button>

  <script>
    // alert(`WELCOME TO ROCK PAPER SCISSORS GAME\n\nClick on the button to play the game`);
    let result = '';
    let computerMove = '';
    let playerMove = '';

    // Extract score from local storage
    const score = JSON.parse(localStorage.getItem('score')) || {
      win: 0,
      lose: 0,
      tie: 0,
    };

    // Display initial score
    document.querySelector('.display-score').innerHTML = `Score : You win: ${score.win}, You lose: ${score.lose}, Tie: ${score.tie}`;

    // Function to pick computer move
    function pickComputerMove() {
      const randomNumber = Math.random();
      if (randomNumber < 1 / 3) {
        return 'rock';
      } else if (randomNumber < 2 / 3) {
        return 'paper';
      } else {
        return 'scissor';
      }
    }

    // Function to play the game
    function playGame(playerMove) {
      const computerMove = pickComputerMove();
      if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'TIE';
        } else if (computerMove === 'paper') {
          result = 'YOU LOSE';
        } else {
          result = 'YOU WIN';
        }
      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'YOU WIN';
        } else if (computerMove === 'paper') {
          result = 'TIE';
        } else {
          result = 'YOU LOSE';
        }
      } else if (playerMove === 'scissor') {
        if (computerMove === 'rock') {
          result = 'YOU LOSE';
        } else if (computerMove === 'paper') {
          result = 'YOU WIN';
        } else {
          result = 'TIE';
        }
      }

      // Update score
      if (result === 'YOU WIN') {
        score.win++;
        document.querySelector('.display-result').style.color = 'green';
      } else if (result === 'YOU LOSE') {
        score.lose++;
        document.querySelector('.display-result').style.color = 'red';
      } else if(result === 'TIE') {
        score.tie++;
        document.querySelector('.display-result').style.color = 'blue';
      }

      // Display result, choice, and score
      document.querySelector('.display-result').innerHTML = result;
      document.querySelector('.display-choice').innerHTML = `You chose: ${playerMove}<br>Computer chose: ${computerMove}`;
      document.querySelector('.display-score').innerHTML = `Score : You win: ${score.win}, You lose: ${score.lose}, Tie: ${score.tie}`;

      // Store score in local storage
      localStorage.setItem('score', JSON.stringify(score));
    }
  </script>
</body>
</html>
