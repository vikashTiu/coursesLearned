    function minMax(arr){
      let result = {
        min : Math.min(...arr),
        max : Math.max(...arr)
      }
      if(arr.length === 0){
        console.log('Array is empty');
        result.max = null;
        result.min = null;
      } 
      console.log(result);
    }
    minMax([1,-3,5]);
    minMax([-2,3,-5,7,10]);

    minMax([3])

    function countWords(arr){
      let wordsCount ={};

      for (let i=0; i<arr.length; i++){
        let words = arr[i].split(' ').filter(word => word !== '');
        for(let word of words){
          word = word.toLowerCase();
          wordsCount[word] = (wordsCount[word] || 0) + 1;
        }
      }
      console.log(wordsCount)
    }
 
    countWords(['apple', 'apple', '','banana', 'apple-pie']);
