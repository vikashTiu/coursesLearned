<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>
<body>
  <p>
    <h1>Calculator</h1>
    <button onclick="
    calculaton+='1';
    console.log(`calculaton : ${calculaton}`);
    ">1</button>

    <button onclick="
    calculaton+='2';
    console.log(`calculaton : ${calculaton}`);
    ">2</button>

    <button onclick="
    calculaton+='3';
    console.log(`calculaton : ${calculaton}`);
    ">3</button>
  </p>
  <p>
    <button onclick="
    calculaton+='4';
    console.log(`calculaton : ${calculaton}`);
    ">4</button>
      
    <button onclick="
    calculaton+='5';
    console.log(`calculaton : ${calculaton}`);
    ">5</button>
  
    <button onclick="
    calculaton+='6';
    console.log(`calculaton : ${calculaton}`);
    ">6</button>
  </p>
  <p>
    <button onclick="
    calculaton+='7';
    console.log(`calculaton : ${calculaton}`);
    ">7</button>
      
    <button onclick="
    calculaton+='8';
    console.log(`calculaton : ${calculaton}`);
    ">8</button>
  
    <button onclick="
    calculaton+='9';
    console.log(`calculaton : ${calculaton}`);
    ">9</button>
  </p>
  <p>
    <button onclick="
    calculaton+=' + ';
    console.log(`calculaton : ${calculaton}`);
    ">+</button>

    <button onclick="
    calculaton = eval(calculaton);
    console.log(`calculaton : ${calculaton}`)">=</button>

    <button onclick="
    calculaton+='0';
    console.log(`calculaton : ${calculaton}`);
    ">0</button>
  </p>

  <script>
    let calculaton = '';
  </script>
</body>
</html>
