<body>
  <script>
    const var1 = undefined;
    if (1){
      console.log("true")
      console.log(!1)
      console.log(var1)
    }else{
      console.log("NaN applied")
    }
    console.log("--GuardOperator(&& ||)--")
    const message = true && "This will be shown";
    console.log(message);

    const message2 = "" || "2nd message";
    console.log(message2);

    //-----Functions------

    function farhenhritToCelcius(farhenheit){
      return (farhenheit - 32) * 5 / 9;
    }
    console.log(farhenhritToCelcius(86));

    function celciusTOFerhenheit(celcius){
      return (celcius * 9 / 5 )  + 32;
    }
    console.log(celciusTOFerhenheit(25))

    //function to convert Temperature
    function convertTemperature(degree, unit){
      if (unit === "C"){
        return celciusTOFerhenheit(degree)+ "F";
      }else if (unit === "F"){
        return farhenhritToCelcius(degree)+ "C";
      }
    }
    console.log(convertTemperature(25, "C"));
    console.log(convertTemperature(86, "F"))

    //function to convert Length
    function convertLength(length , from, to){
      if (from === "miles" && to === "miles"){
        return length + "miles";  
      }else if (from === "km" && to === "km"){
        return length + "km";
      }else if (from === "miles" && to === "km"){
        return length * 1.6 + "km";
      }else if(from === "km"&& to === "miles"){
        return length / 1.6 + "miles";
      }
    }

    console.log(convertLength(50,"miles","km"));
    console.log(convertLength(32,"km","miles"));
    console.log(convertLength(50,"miles","miles"));
    console.log(convertLength(32,"km","km"));

    //function to convert length (miles,km,feet)
    function convertLength(length , from, to){
      if (from === "miles" && to === "miles"){
        return length + "miles";  
      }else if (from === "km" && to === "km"){
        return length + "km";
      }else if(from === "feet" && to === "feet"){
        return length + "feet";
      }else if (from === "miles" && to === "km"){
        return length * 1.6 + "km";
      }else if(from === "km"&& to === "miles"){
        return length / 1.6 + "miles";
      }else if(from === "miles" && to === "feet"){
        return length * 5280 + "feet";
      }else if(from === "km" && to === "feet"){
        return length * 3281 + "feet";
      }else if (from === "feet" && to === "miles"){
        return length / 5280 + "miles";
      }else if(from === "feet" && to === "km"){
        return length / 3281 + "km";
      }     
      //check for invalid unit
      const validUnits = ["miles" , "km" ,"feet"];
      if ( !validUnits.includes(from)){
        return `Invalid unit : ${from}`;
      }else if(!validUnits.includes(to)){
        return `Invalid unit : ${to}`;
      }
    }


    //Checking Invalid unit
    console.log(convertLength( 5, "feet" , "lbs"));
    console.log(convertLength( 5, "lbs" , "km"));
    console.log(convertLength( 5, "lbs" , "lbs"));

  </script>
